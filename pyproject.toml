[project]
name = "fake-api"
version = "0.1.0"
description = "A deliberately silly API and UI with built-in flaky and broken parts."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "behave>=1.2", "playwright>=1.45"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
